[project]
name = "autograder"
version = "2.0.0"
description = "Rule-driven grading agent for C programs (CS5103 Agentic-AI lab) - FastAPI + React"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.21",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
ast = ["tree-sitter>=0.23", "tree-sitter-c>=0.23"]
aidetect = ["llama-cpp-python>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
browser = ["playwright>=1.64"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "sandbox: needs Docker or WSL sandbox",
  "llm: needs Ollama",
  "slow: long running",
]
